[package]
name = "katwork"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
smoke-fixtures = []
# Test seams that must never reach a production build. Only katwork-server's dev-dependency
# turns this on, so a release binary cannot call them.
test-support = []

[dependencies]
jsonschema.workspace = true
async-trait.workspace = true
async-stream.workspace = true
bytes.workspace = true
futures.workspace = true
rig-core.workspace = true
rig-reqwest.workspace = true
reqwest.workspace = true
tracing.workspace = true
percent-encoding.workspace = true
thiserror.workspace = true
url.workspace = true
unicode-properties.workspace = true
sqlx.workspace = true
uuid.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
katwork-thai = { path = "../katwork-thai" }
# The artifact store stages files with tokio's fs and io traits.
tokio = { workspace = true, features = ["fs", "io-util"] }
tokio-util = { workspace = true, features = ["rt"] }

argon2.workspace = true
base64.workspace = true
rand_core.workspace = true
sha2.workspace = true
lettre.workspace = true
unicode-normalization.workspace = true
caseless.workspace = true

unicode-segmentation.workspace = true
pulldown-cmark.workspace = true
regex-syntax.workspace = true
zip.workspace = true
quick-xml.workspace = true
crc32fast.workspace = true
flate2.workspace = true
lopdf.workspace = true
pdf-extract.workspace = true
weezl.workspace = true

# The XLSX reader: number formats rounded in decimal (header units use katwork-thai, above).
rust_decimal.workspace = true

# The writers (SP2a Task 9): DOCX through docx-rs, XLSX through rust_xlsxwriter. No image
# support: a Kat's document holds no pictures.
docx-rs = { version = "=0.4.22", default-features = false }
rust_xlsxwriter = { version = "=0.101.0", default-features = false }
# Bidi classes, to refuse right-to-left letters in a writer's content (they reorder figures).
unicode-bidi = { version = "0.3.18", default-features = false, features = ["hardcoded-data"] }

# statvfs for the artifact store's free space (f_bavail x f_frsize); std has no call for it.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["fs"] }

[dev-dependencies]
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["test-util", "io-util"] }
