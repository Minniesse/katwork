[package]
name = "katwork"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
smoke-fixtures = []
# Test seams that must never reach a production build. Only katwork-server's dev-dependency
# turns this on, so a release binary cannot call them.
test-support = []

[dependencies]
jsonschema.workspace = true
async-trait.workspace = true
async-stream.workspace = true
bytes.workspace = true
futures.workspace = true
rig-core.workspace = true
rig-reqwest.workspace = true
reqwest.workspace = true
tracing.workspace = true
percent-encoding.workspace = true
thiserror.workspace = true
url.workspace = true
unicode-properties.workspace = true
sqlx.workspace = true
uuid.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
# The artifact store stages files with tokio's fs and io traits.
tokio = { workspace = true, features = ["fs", "io-util"] }
tokio-util = { workspace = true, features = ["rt"] }

argon2.workspace = true
base64.workspace = true
rand_core.workspace = true
sha2.workspace = true
lettre.workspace = true
unicode-normalization.workspace = true
caseless.workspace = true

unicode-segmentation.workspace = true
pulldown-cmark.workspace = true
regex-syntax.workspace = true
zip.workspace = true
quick-xml.workspace = true
crc32fast.workspace = true

# statvfs for the artifact store's free space (f_bavail x f_frsize); std has no call for it.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["fs"] }

[dev-dependencies]
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["test-util", "io-util"] }
flate2.workspace = true
