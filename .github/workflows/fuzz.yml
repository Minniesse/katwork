name: Fuzz

# The readers' fuzz targets for 10 minutes each, nightly; ci.yml's fuzz-smoke runs them for 60 s
# on pull requests that change them.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [package, docx, text]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          # Keep in step with fuzz/rust-toolchain.toml.
          toolchain: nightly-2026-10-01
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/bin/cargo-fuzz
            ~/.cargo/registry
            fuzz/target
          key: fuzz-${{ runner.os }}-${{ hashFiles('fuzz/Cargo.lock', 'fuzz/rust-toolchain.toml') }}
      - name: Install cargo-fuzz
        working-directory: fuzz
        run: command -v cargo-fuzz || cargo install cargo-fuzz --locked --version 0.13.2
      - name: Fuzz for 10 minutes
        working-directory: fuzz
        env:
          TARGET: ${{ matrix.target }}
        # New inputs go to a scratch corpus; the committed seeds are read only.
        run: |
          mkdir -p "$RUNNER_TEMP/corpus"
          cargo fuzz run "$TARGET" "$RUNNER_TEMP/corpus" "corpus/$TARGET" -a -- \
            -max_total_time=600 -timeout=10 -rss_limit_mb=1024
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts
