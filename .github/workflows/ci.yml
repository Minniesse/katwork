name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: katwork
          POSTGRES_DB: katwork
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U katwork -d katwork"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://katwork@localhost:5432/katwork
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --locked
      - run: cargo test -p katwork --locked --features smoke-fixtures --test smoke_fixtures
      - run: scripts/init-env.sh
      - run: docker compose config -q
      - run: docker compose build katwork

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - run: cargo +1.97.1 check --workspace --locked

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check:contrast
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: scripts/smoke.sh

  upgrade_from_previous_release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Find previous release tag
        id: previous
        run: |
          tag=$(git tag --merged HEAD --list 'v[0-9]*' --sort=-version:refname | head -n 1)
          if [ -z "$tag" ]; then
            echo 'SKIP upgrade_from_previous_release: no previous v* release tag exists.'
          else
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.previous.outputs.tag != ''
      - name: Build previous release image
        if: steps.previous.outputs.tag != ''
        env:
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
        run: |
          mkdir "$RUNNER_TEMP/katwork-previous"
          git archive "$PREVIOUS_TAG" | tar -x -C "$RUNNER_TEMP/katwork-previous"
          docker build -t katwork-previous:local "$RUNNER_TEMP/katwork-previous"
      - name: Build current image and run smoke scenarios
        if: steps.previous.outputs.tag != ''
        run: scripts/smoke.sh
      - name: Upgrade seeded previous release through backup and migrate
        if: steps.previous.outputs.tag != ''
        env:
          KATWORK_PREVIOUS_IMAGE: katwork-previous:local
        run: cargo test -p katwork-server --locked --test e2e_compose upgrade_from_previous_release -- --ignored --exact
