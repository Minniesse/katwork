name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.97.1
          components: clippy
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: katwork
          POSTGRES_DB: katwork
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U katwork -d katwork"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://katwork@localhost:5432/katwork
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.97.1
      - run: cargo test --workspace --locked
      - run: cargo test -p katwork --locked --features smoke-fixtures --test smoke_fixtures
      - run: scripts/init-env.sh
      - run: docker compose config -q
      - run: docker compose build katwork
        env:
          CARGO_FEATURES: smoke-fixtures
      - name: Release target rejects smoke features even when passed directly
        run: |
          if docker build --target release --build-arg CARGO_FEATURES=smoke-fixtures .; then
            echo 'ERROR: the release target accepted smoke fixtures.' >&2
            exit 1
          fi

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.97.1
      - run: cargo +1.97.1 check --workspace --locked

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check:contrast
      - run: npm run build

  fuzz-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # A workflow skipped by a paths filter would leave this required check pending, so the job
      # always runs and fuzzes only when the readers or the fuzz crate changed.
      - name: Check whether the readers changed
        id: changed
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE" HEAD -- crates/katwork/src/docs fuzz; then
            echo 'SKIP fuzz-smoke: crates/katwork/src/docs and fuzz are unchanged.'
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: steps.changed.outputs.run == 'true'
        with:
          # Keep in step with fuzz/rust-toolchain.toml.
          toolchain: nightly-2026-10-01
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: steps.changed.outputs.run == 'true'
        with:
          path: |
            ~/.cargo/bin/cargo-fuzz
            ~/.cargo/registry
            fuzz/target
          key: fuzz-${{ runner.os }}-${{ hashFiles('fuzz/Cargo.lock', 'fuzz/rust-toolchain.toml') }}
      - name: Install cargo-fuzz
        if: steps.changed.outputs.run == 'true'
        working-directory: fuzz
        run: command -v cargo-fuzz || cargo install cargo-fuzz --locked --version 0.13.2
      - name: Every target has committed seeds
        if: steps.changed.outputs.run == 'true'
        run: for target in package docx text; do test -n "$(ls "fuzz/corpus/$target")"; done
      - name: Fuzz each target for 60 s
        if: steps.changed.outputs.run == 'true'
        working-directory: fuzz
        # New inputs go to a scratch corpus; the committed seeds are read only.
        run: |
          for target in package docx text; do
            mkdir -p "$RUNNER_TEMP/corpus/$target"
            cargo fuzz run "$target" "$RUNNER_TEMP/corpus/$target" "corpus/$target" -a -- \
              -max_total_time=60 -timeout=10 -rss_limit_mb=1024
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.97.1
      - run: scripts/smoke.sh

  upgrade_from_previous_release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Find previous release tag
        id: previous
        run: |
          tag=$(git tag --merged HEAD --list 'v[0-9]*' --sort=-version:refname | head -n 1)
          if [ -z "$tag" ]; then
            echo 'SKIP upgrade_from_previous_release: no previous v* release tag exists.'
          else
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: steps.previous.outputs.tag != ''
        with:
          toolchain: 1.97.1
      - name: Build previous release image
        if: steps.previous.outputs.tag != ''
        env:
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
        run: |
          mkdir "$RUNNER_TEMP/katwork-previous"
          git archive "$PREVIOUS_TAG" | tar -x -C "$RUNNER_TEMP/katwork-previous"
          docker build -t katwork-previous:local "$RUNNER_TEMP/katwork-previous"
      - name: Build current smoke image
        if: steps.previous.outputs.tag != ''
        run: |
          scripts/init-env.sh
          docker compose -f docker-compose.yml -f docker-compose.smoke.yml build katwork
      - name: Upgrade seeded previous release through backup and migrate
        if: steps.previous.outputs.tag != ''
        env:
          KATWORK_PREVIOUS_IMAGE: katwork-previous:local
        run: cargo test -p katwork-server --locked --test e2e_compose upgrade_from_previous_release -- --ignored --exact
