[workspace]
members = ["crates/katwork", "crates/katwork-server"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"

[workspace.dependencies]
async-trait = "0.1"
async-stream = "0.3"
bytes = "1"
futures = "0.3"
rig-core = { version = "=0.45.0", default-features = false, features = ["reqwest", "rustls"] }
rig-reqwest = { version = "=0.45.0", default-features = false, features = ["rustls"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = "0.8"
percent-encoding = "2"
serde_json = "1"
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-aws-lc-rs", "macros", "uuid", "chrono", "json", "migrate"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
tower = { version = "0.5", features = ["util"] }
url = "2"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
