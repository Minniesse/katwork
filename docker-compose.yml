x-katwork-image: &katwork-image
  image: ${KATWORK_IMAGE:-katwork:local}
  build:
    context: .
    target: release

x-katwork-environment: &katwork-environment
  DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env, or run scripts/init-env.sh}
  KATWORK_SECRET: ${KATWORK_SECRET:?set KATWORK_SECRET in .env, or run scripts/init-env.sh}
  KATWORK_DEMO: ${KATWORK_DEMO:-}
  KATWORK_PUBLIC_URL: ${KATWORK_PUBLIC_URL:-}
  # Read only for the startup warning: the server listens on 0.0.0.0 inside the container.
  KATWORK_BIND: ${KATWORK_BIND:-}
  KATWORK_ALLOW_DEMO_ON_HTTPS: ${KATWORK_ALLOW_DEMO_ON_HTTPS:-}
  KATWORK_TRUSTED_PROXIES: ${KATWORK_TRUSTED_PROXIES:-}
  KATWORK_HEADER_TIMEOUT_SECONDS: ${KATWORK_HEADER_TIMEOUT_SECONDS:-}
  KATWORK_LOCK_TIMEOUT_MS: ${KATWORK_LOCK_TIMEOUT_MS:-}
  KATWORK_DOC_WORKERS: ${KATWORK_DOC_WORKERS:-}
  KATWORK_DOC_MAX_XML_ELEMENTS: ${KATWORK_DOC_MAX_XML_ELEMENTS:-}
  KATWORK_DOC_MAX_READ_BYTES: ${KATWORK_DOC_MAX_READ_BYTES:-}
  # Uploaded and written files: pinned to the artifacts volume's mount point, so .env cannot
  # move them off the volume.
  KATWORK_ARTIFACT_DIR: /var/lib/katwork/artifacts
  KATWORK_UPLOAD_MAX_BYTES: ${KATWORK_UPLOAD_MAX_BYTES:-}
  KATWORK_WORKSPACE_STORAGE_BYTES: ${KATWORK_WORKSPACE_STORAGE_BYTES:-}
  KATWORK_UPLOAD_MIN_BYTES_PER_SEC: ${KATWORK_UPLOAD_MIN_BYTES_PER_SEC:-}
  KATWORK_UPLOAD_RATE_WINDOW_MS: ${KATWORK_UPLOAD_RATE_WINDOW_MS:-}
  KATWORK_IDLE_TIMEOUT_SECONDS: ${KATWORK_IDLE_TIMEOUT_SECONDS:-}
  KATWORK_MAX_CONNECTIONS: ${KATWORK_MAX_CONNECTIONS:-}
  KATWORK_MAX_CONNECTIONS_PER_IP: ${KATWORK_MAX_CONNECTIONS_PER_IP:-}
  KATWORK_DEMO_PASSWORD: ${KATWORK_DEMO_PASSWORD:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
  KATWORK_LOCAL_BASE_URL: ${KATWORK_LOCAL_BASE_URL:-}
  KATWORK_LOCAL_MODEL: ${KATWORK_LOCAL_MODEL:-}
  KATWORK_LOCAL_API_KEY: ${KATWORK_LOCAL_API_KEY:-}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env, or run scripts/init-env.sh}

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    networks: [backend]
    environment:
      POSTGRES_USER: katwork
      POSTGRES_DB: katwork
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env, or run scripts/init-env.sh}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U katwork -d katwork"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.19.2
    networks: [backend]
    volumes:
      - qdrant_data:/qdrant/storage

  # Before every start: the database, then the files of the artifacts volume (README, Backups
  # and upgrades).
  backup:
    image: postgres:17
    restart: "no"
    cap_drop: [ALL]
    # Reads the app's private files (owner 65532, mode 0600) to copy them; writes nothing there.
    cap_add: [DAC_READ_SEARCH]
    security_opt: ["no-new-privileges:true"]
    networks: [backend]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env, or run scripts/init-env.sh}
    entrypoint: ["sh", "/scripts/compose-backup.sh"]
    volumes:
      - ./scripts/compose-backup.sh:/scripts/compose-backup.sh:ro
      - ./backups:/backups
      - artifacts:/var/lib/katwork/artifacts:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Run by hand to copy a files backup back into the artifacts volume (README, Backups and
  # upgrades); never started by `up`.
  restore-files:
    image: postgres:17
    profiles: [restore]
    restart: "no"
    network_mode: none
    cap_drop: [ALL]
    # Writes into the app's private folders and gives the files back to its user, 65532.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["sh", "/scripts/compose-restore-files.sh"]
    volumes:
      - ./scripts/compose-restore-files.sh:/scripts/compose-restore-files.sh:ro
      - ./backups:/backups:ro
      - artifacts:/var/lib/katwork/artifacts

  migrate:
    <<: *katwork-image
    command: ["migrate"]
    restart: "no"
    networks: [backend]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment: *katwork-environment
    depends_on:
      backup:
        condition: service_completed_successfully

  katwork:
    <<: *katwork-image
    # Also restarts the server the document pool watchdog exits (code 70) when the pool wedges.
    restart: unless-stopped
    mem_limit: ${KATWORK_MEMORY_LIMIT:-4g}
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
    networks: [backend, default]
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment: *katwork-environment
    # The image creates the mount point owned by its non-root user, and a new volume copies
    # that owner. The backup service copies it after each database backup.
    volumes:
      - artifacts:/var/lib/katwork/artifacts
    healthcheck:
      test: ["CMD", "/app/katwork-server", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    ports:
      - "${KATWORK_BIND:-127.0.0.1}:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

networks:
  backend:
    internal: true
  default:

volumes:
  postgres_data:
  qdrant_data:
  artifacts:
