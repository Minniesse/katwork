[advisories]
ignore = [
    # chrono is unmaintained with no safe upgrade; not a vulnerability. Replacing it is #141.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained, replacement tracked in #141" },
    # zip 8.6 comes only through docx-rs, and these advisories are all in zip's read and extract
    # code. KatWork writes DOCX with docx-rs and never reads with it: the test
    # `katwork_never_reads_with_docx_rs` (crates/katwork/tests/write_docs.rs) fails on any use
    # of docx-rs beyond the writer's builder types.
    { id = "RUSTSEC-2026-0367", reason = "zip 8.6 read path via docx-rs; KatWork only writes DOCX with docx-rs, never reads; remove in #167" },
    { id = "RUSTSEC-2026-0368", reason = "zip 8.6 read path via docx-rs; KatWork only writes DOCX with docx-rs, never reads; remove in #167" },
    { id = "RUSTSEC-2026-0369", reason = "zip 8.6 read path via docx-rs; KatWork only writes DOCX with docx-rs, never reads; remove in #167" },
    { id = "RUSTSEC-2026-0429", reason = "zip 8.6 read path via docx-rs; KatWork only writes DOCX with docx-rs, never reads; remove in #167" },
    { id = "RUSTSEC-2026-0545", reason = "zip 8.6 read path via docx-rs; KatWork only writes DOCX with docx-rs, never reads; remove in #167" },
    { id = "RUSTSEC-2026-0546", reason = "zip 8.6 read path via docx-rs; KatWork only writes DOCX with docx-rs, never reads; remove in #167" },
    { id = "RUSTSEC-2026-0547", reason = "zip 8.6 read path via docx-rs; KatWork only writes DOCX with docx-rs, never reads; remove in #167" },
    { id = "RUSTSEC-2026-0548", reason = "zip 8.6 read path via docx-rs; KatWork only writes DOCX with docx-rs, never reads; remove in #167" },
]

[licenses]
# Unlisted licenses are denied, including GPL-2.0, GPL-3.0 and AGPL-3.0
# (both -only and -or-later variants).
allow = ["Apache-2.0", "BSD-3-Clause", "CDLA-Permissive-2.0", "ISC", "MIT", "Unicode-3.0", "Zlib"]

# Lettre's MIME encoder uses the permissive BSD Zero Clause license.
[[licenses.exceptions]]
name = "quoted_printable"
allow = ["0BSD"]

# jsonschema's URI resolver uses MIT without an attribution requirement.
[[licenses.exceptions]]
name = "borrow-or-share"
allow = ["MIT-0"]

# The only git source is the pdf-extract fork, at a pinned revision (the SP2a plan, Task 5).
[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
allow-git = ["https://github.com/Minniesse/pdf-extract"]
